<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutinas públicas</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe3dc;
            color: #1f2937;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 18px 30px;
        }

        .container {
            background: rgba(255,255,255,0.18);
            border: 2px solid rgba(0,0,0,0.18);
            border-radius: 12px;
            padding: 18px 18px 26px;
        }

        .header-idea {
            background: #0a7db8;
            border-radius: 16px;
            border: 4px solid #1d2b36;
            box-shadow: 0 6px 0 rgba(0,0,0,0.18);
            padding: 18px 24px;
            margin-bottom: 18px;
            text-align: center;
        }

        .header-idea h1 {
            margin: 0;
            font-size: clamp(2.3rem, 4vw, 4rem);
            font-weight: 900;
            letter-spacing: 0.02em;
            color: #fff;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }

        .nav {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .nav a {
            display: inline-block;
            background: #0d7a76;
            color: #fff;
            text-decoration: none;
            padding: 12px 26px;
            border-radius: 12px;
            font-weight: 800;
            min-width: 120px;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.16);
        }

        .toolbar {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 16px;
            background: transparent;
            border: 3px dashed #1d2b36;
            border-radius: 18px;
            padding: 14px 18px 14px 18px;
        }

        .search-box input {
            flex: 1;
            border: 0;
            background: transparent;
            font-size: 1rem;
            padding: 10px 0;
            color: #1f2937;
            outline: none;
        }

        .search-box input::placeholder {
            color: #495b6a;
            opacity: 1;
        }

        .search-box button {
            border: 0;
            background: #0d7a76;
            color: #fff;
            font-weight: 800;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            min-width: 120px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.16);
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 18px;
            font-weight: 700;
            color: #1f2937;
            flex-wrap: wrap;
        }

        .pagination a {
            color: #0d7a76;
            text-decoration: none;
        }

        @media (max-width: 640px) {
            .nav,
            .search-box {
                flex-direction: column;
                width: 100%;
            }
            .nav a,
            .search-box button {
                width: 100%;
            }
            .header-idea h1 {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            <div class="header-idea">
                <h1>Ideas para crear rutinas públicas</h1>
            </div>

            <div class="topbar">
                <nav class="nav">
                    <a href="{% url 'home' %}">Inicio</a>
                    <a href="{% url 'rutinas_publicas' %}">Rutinas</a>
                </nav>
            </div>

            <form class="toolbar" method="get">
                <div class="search-box">
                    <input type="text" name="q" id="q" value="{{ query }}" placeholder="Buscar por título, descripción o disciplina">
                    <button type="submit">Buscar</button>
                </div>
            </form>

            {% if page_obj %}
                <div class="pagination">
                    {% if page_obj.has_previous %}
                        <a href="?q={{ query }}&page={{ page_obj.previous_page_number }}">Anterior</a>
                    {% endif %}

                    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>

                    {% if page_obj.has_next %}
                        <a href="?q={{ query }}&page={{ page_obj.next_page_number }}">Siguiente</a>
                    {% endif %}
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
