<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio y Rutina</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #fff;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1800&q=80');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 30px 35px 0 35px;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.52);
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 3.1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }

        .nav {
            display: flex;
            gap: 18px;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            background: #0d7a76;
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px rgba(13,122,118,0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 22px rgba(13,122,118,0.45);
            filter: brightness(1.06);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .summary-card {
            width: min(480px, 100%);
            background: rgba(15, 23, 42, 0.62);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 24px 28px;
            backdrop-filter: blur(2px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(30px);
            animation: cardIn 0.8s ease forwards;
            animation-delay: 0.2s;
        }

        .summary-card h2 {
            margin: 0 0 18px;
            font-size: 2.1rem;
            color: #fff;
        }

        .summary-card p {
            margin: 12px 0;
            font-size: 1.05rem;
            color: #f4f6fb;
        }

        .summary-card strong {
            font-size: 1.05rem;
            color: #fff;
        }

        .summary-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .summary-card .label {
            font-size: 1.05rem;
        }

        .summary-card .value {
            font-weight: 700;
            font-size: 1.05rem;
            display: inline-block;
            min-width: 2ch;
            text-align: right;
            opacity: 0;
            transform: translateY(12px);
            text-shadow: 0 0 12px rgba(80, 238, 204, 0.25);
        }

        .summary-card .row.visible .value {
            animation: stopwatchTick 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .summary-card .row:nth-child(2) .value {
            animation-delay: 0.15s;
        }

        .summary-card .row:nth-child(3) .value {
            animation-delay: 0.3s;
        }

        @keyframes stopwatchTick {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.85);
            }
            30% {
                opacity: 1;
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero.is-started .summary-card {
            animation: cardIn 0.8s ease forwards;
        }

        .hero.is-started h1 {
            animation: titlePulse 0.7s ease;
        }

        @keyframes titlePulse {
            0% { transform: scale(0.96); opacity: 0.6; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 700px) {
            .hero {
                padding: 20px 18px 30px;
                min-height: 420px;
            }

            h1 {
                font-size: 2.3rem;
            }

            .nav {
                gap: 12px;
                flex-wrap: wrap;
            }

            .btn {
                padding: 10px 20px;
            }

            .summary-card h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h1>Gimnasio y Rutina</h1>

            <nav class="nav">
                <a class="btn start-btn" href="#" aria-label="Inicio">Inicio</a>
                <a class="btn" href="{% url 'rutinas_publicas' %}">Rutinas</a>
            </nav>

            <section class="summary-card">
                <h2>Resumen</h2>
                <div class="row visible">
                    <span class="label">Rutinas:</span>
                    <span class="value" data-target="{{ total_rutinas }}">0</span>
                </div>
                <div class="row visible">
                    <span class="label">Disciplinas:</span>
                    <span class="value" data-target="{{ total_disciplinas }}">0</span>
                </div>
                <div class="row visible">
                    <span class="label">Equipamientos:</span>
                    <span class="value" data-target="{{ total_equipamientos }}">0</span>
                </div>
            </section>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.querySelector('.hero');
            const startBtn = document.querySelector('.start-btn');
            const counters = document.querySelectorAll('.value');

            const runCounters = () => {
                counters.forEach((counter) => {
                    const target = Number(counter.dataset.target || 0);
                    const duration = 1400;
                    let start = null;

                    function animate(now) {
                        if (!start) start = now;
                        const progress = Math.min((now - start) / duration, 1);
                        const eased = 1 - Math.pow(1 - progress, 4);
                        const current = Math.round(target * eased);
                        counter.textContent = current;

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            counter.textContent = target;
                        }
                    }

                    requestAnimationFrame(animate);
                });
            };

            startBtn.addEventListener('click', (event) => {
                event.preventDefault();
                hero.classList.add('is-started');
                setTimeout(() => {
                    runCounters();
                }, 100);
            });

            runCounters();
        });
    </script>
</body>
</html>
