<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gimnasio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #fff;
        }

        .hero {
            position: relative;
            min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1800&q=80');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 30px 35px;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
        }

        .content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 18px;
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }

        .nav {
            display: flex;
            gap: 18px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            display: inline-block;
            background: #0d7a76;
            color: #fff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 6px 18px rgba(13,122,118,0.35);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.06);
        }

        /* Tarjeta contenedora con el mismo estilo del Resumen */
        .form-card {
            width: min(480px, 100%);
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 30px;
            backdrop-filter: blur(4px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.3);
        }

        .form-card label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #f4f6fb;
        }

        .form-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
        }

        .form-card input:focus {
            outline: none;
            border-color: #0d7a76;
        }

        .form-card button[type="submit"] {
            background: #0d7a76;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(13,122,118,0.35);
            width: 100%;
        }

        .form-card button[type="submit"]:hover {
            filter: brightness(1.06);
        }

        .form-links {
            margin-top: 15px;
            text-align: center;
        }

        .form-links a {
            color: #50eacc;
            text-decoration: none;
            font-weight: 600;
        }

        .form-links a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #f87171;
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h1>Gimnasio y Rutina</h1>

            <!-- Menú de navegación consistente -->
            <nav class="nav">
                <a class="btn" href="{% url 'home' %}">Inicio</a>
                <a class="btn" href="{% url 'rutinas_publicas' %}">Rutinas</a>
                <a class="btn" href="{% url 'login' %}">Iniciar Sesión</a>
                <a class="btn" href="{% url 'registro' %}">Registrarse</a>
            </nav>

            <!-- Tarjeta del formulario de Iniciar Sesión -->
            <div class="form-card">
                <h2>Iniciar Sesión</h2>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    
                    <div>
                        <label for="id_username">Usuario:</label>
                        {{ form.username }}
                    </div>
                    <div>
                        <label for="id_password">Contraseña:</label>
                        {{ form.password }}
                    </div>
                    
                    <button type="submit">Ingresar</button>
                </form>

                <div class="form-links">
                    <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
                    <p><a href="{% url 'home' %}">Volver a la portada</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
