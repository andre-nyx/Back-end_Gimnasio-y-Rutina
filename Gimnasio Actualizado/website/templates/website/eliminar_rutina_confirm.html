<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación - Gimnasio</title>
</head>
<body>
    <h2>Confirmar Eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar la rutina "<strong>{{ rutina.titulo }}</strong>"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar rutina</button>
        <a href="{% url 'mis_rutinas' %}">Cancelar</a>
    </form>
</body>
</html>
