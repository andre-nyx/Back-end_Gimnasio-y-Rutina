
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Equipamiento</title>
</head>
<body>
    <h2>Crear nuevo equipamiento</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label for="nombre">Nombre del equipamiento:</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" required>
        <button type="submit">Guardar equipamiento</button>
    </form>

    <a href="{% url 'crear_rutina' %}">Volver a crear rutina</a>
</body>
</html>
